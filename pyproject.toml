[project]
name = "labinacan"
dynamic = ["version"]
description = "labinacan: the template of an agent-run research project, with its site, papers, posts and literature review."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Sackfield" }]
maintainers = [{ name = "labinacan", email = "contact@example.org" }]
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
    "pydantic>=2.7.0",
    "jinja2>=3.1.3",
    "boto3>=1.34.0",
    "click>=8.1.0",
    "tldextract>=5.1",
    "presidio-analyzer>=2.2",
    "markdown-it-py>=4.0",
    "mdit-py-plugins>=0.6.1",
    "latex2mathml>=3.81.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/8W9aG/labinacan/"
Repository = "https://github.com/8W9aG/labinacan"

[dependency-groups]
dev = [
    "diff-cover>=9.2",
    "interrogate>=1.7.0",
    "mcp>=2.0",
    "mypy>=1.13",
    "mutmut==3.8.1",  # make mutation (scripts/mutation.py); pinned, as its internals are used
    "pagefind[bin]>=1.3.0",
    "pymarkdownlnt>=0.9.41",
    "pytest>=8.0.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
    "vulture>=2.16",
    "yamllint>=1.38.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "labinacan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["labinacan"]

[tool.labinacan]
# The example project's values (labinacan/config.py). A new project changes these first.
name = "labinacan"
package = "labinacan"
env_prefix = "LABINACAN"
linear_team = "LAB"
maintainer = "8W9aG"
hf_dataset = "8W9aG/labinacan-exchange"
generated = []
data_only = []
automatic_issue_workflows = []

[tool.labinacan.brand]
# The example's brand: a can on the 3 x 3 grid of the mark. Its lid row is full, its label
# column is full and its sides are two thirds full, so the shape reads without colour.
folder = "brand"  # the brand's files, inside the package
tile = "#0F172A"  # the mark's tile: Tailwind's slate-900
ink = { light = "#0F172A", dark = "#F8FAFC" }  # the wordmark
colours = { lid = "#94A3B8", side = "#2DD4BF", label = "#F59E0B" }
cells = [
  [0, 0, 3, "lid"], [1, 0, 3, "lid"], [2, 0, 3, "lid"],
  [0, 1, 2, "side"], [1, 1, 3, "label"], [2, 1, 2, "side"],
  [0, 2, 2, "side"], [1, 2, 3, "label"], [2, 2, 2, "side"],
]
# The site's links and highlights: Tailwind's teal shades.
accent = { 50 = "#f0fdfa", 100 = "#ccfbf1", 200 = "#99f6e4", 300 = "#5eead4", 400 = "#2dd4bf", 500 = "#14b8a6", 600 = "#0d9488", 700 = "#0f766e", 800 = "#115e59", 900 = "#134e4a", 950 = "#042f2e" }

[tool.pytest.ini_options]
# The package's docstring examples run too. tests/test_doctests.py checks that each public
# function has one.
testpaths = ["tests", "labinacan"]
addopts = "-ra --doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
# A hang fails within three minutes, dumping every thread's stack and naming the test.
timeout = 180
timeout_method = "thread"

[tool.mypy]
# Type checks, ratcheted in module by module. Only the paths in `files` are checked, strictly.
files = ["labinacan/config.py", "labinacan/strict.py"]
plugins = ["pydantic.mypy"]
strict = true
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true

[tool.interrogate]
# Docstring coverage of the package and scripts, private functions included. Raise
# fail-under as coverage rises, to 100, never lower it.
fail-under = 94
ignore-magic = true
ignore-init-method = true
ignore-private = false
ignore-semiprivate = false
ignore-module = false

[tool.mutmut]
# Mutation testing (`make mutation`). source_paths copies the package into mutants/, so the
# tests can import it. Without BASE, only_mutate is the code that a project's checks rest on.
source_paths = ["labinacan"]
only_mutate = ["labinacan/config.py"]
also_copy = [".github/workflows", "scripts"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-o", "addopts=-ra", "-q"]
timeout_constant = 10
pytest_add_cli_args_test_selection = ["tests/test_labinacan_config.py"]
